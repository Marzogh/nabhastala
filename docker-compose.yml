version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: paa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: astro
    ports:
      - "55432:5432"
    volumes:
      - paa_pgdata:/var/lib/postgresql/data
volumes:
  paa_pgdata:
