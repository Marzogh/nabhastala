name: Deploy reviewed site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed release tree
        run: >-
          PYTHONPATH=src python -c "from pathlib import Path; from paa.release import
          validate_release_tree; errors = validate_release_tree(Path('site'));
          assert not errors, '\n'.join(errors)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload reviewed site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy reviewed bytes
        id: deployment
        uses: actions/deploy-pages@v4
