<header class="site-header">
  <div class="site-header__inner">
    <a class="identity" href="{{ identity_href }}" aria-label="Nabhastala home">
      <span class="identity__primary">
        <span class="identity__devanagari" lang="sa-Deva">{{ identity_devanagari }}</span>
        <span class="identity__sanskrit" lang="sa-Latn">{{ motto_sanskrit }}</span>
      </span>
      <span class="identity__translation" aria-label="English translation">
        <span class="identity__english">{{ identity_english }}</span>
        <span class="identity__motto">{{ motto_english }}</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      {% for item in nav_items %}
        <a href="{{ item.href }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
      <button class="theme-toggle js-only" type="button" data-theme-toggle aria-label="Change colour theme" title="Change colour theme">◐</button>
    </nav>
  </div>
</header>
