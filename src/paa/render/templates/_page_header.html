<header class="page-header editorial-hero">
  <div class="editorial-hero__copy">
    <p class="eyebrow">{{ page_eyebrow }}</p>
    <h1>{{ page_title }}</h1>
    <dl class="page-meta">
      <div class="horizon-meta">
        <dt>Observing horizon</dt>
        <dd>
          <details class="horizon-switcher">
            <summary>{{ site_name }}</summary>
            <ul>
              {% for horizon in horizon_links %}
                <li><a href="{{ horizon.href }}"{% if horizon.current %} aria-current="location"{% endif %}>{{ horizon.name }}</a></li>
              {% endfor %}
            </ul>
          </details>
        </dd>
      </div>
      <div><dt>Site ID</dt><dd>{{ site_id|upper }}</dd></div>
      <div><dt>Year</dt><dd>{{ year }}</dd></div>
    </dl>
  </div>
  <figure class="editorial-hero__art" aria-hidden="true">
    <img class="theme-art theme-art--light" src="{{ asset_prefix }}art/heroes/{{ hero_slug }}-light.webp" width="1440" height="480" alt="" fetchpriority="high">
    <img class="theme-art theme-art--dark" src="{{ asset_prefix }}art/heroes/{{ hero_slug }}-dark.webp" width="1440" height="480" alt="" fetchpriority="high">
  </figure>
</header>
