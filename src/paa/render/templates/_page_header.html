<header class="page-header">
  <p class="eyebrow">{{ page_eyebrow }}</p>
  <h1>{{ page_title }}</h1>
  <p class="page-header__description">{{ page_description }}</p>
  <dl class="page-meta">
    <div><dt>Horizon</dt><dd>{{ site_name }}</dd></div>
    <div><dt>Site ID</dt><dd>{{ site_id }}</dd></div>
    <div><dt>Year</dt><dd>{{ year }}</dd></div>
  </dl>
</header>
