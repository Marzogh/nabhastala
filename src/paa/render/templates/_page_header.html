<header class="page-header editorial-hero">
  <div class="editorial-hero__copy">
    <p class="eyebrow">{{ page_eyebrow }}</p>
    <h1>{{ page_title }}</h1>
    <p class="page-header__description">{{ page_description }}</p>
    <dl class="page-meta">
      <div><dt>Horizon</dt><dd>{{ site_name }}</dd></div>
      <div><dt>Site ID</dt><dd>{{ site_id|upper }}</dd></div>
      <div><dt>Year</dt><dd>{{ year }}</dd></div>
    </dl>
  </div>
  <figure class="editorial-hero__art">
    <img class="theme-art theme-art--light" src="{{ asset_prefix }}art/landscape-light.webp" alt="A hand-drawn crescent Moon above a distant horizon and trees">
    <img class="theme-art theme-art--dark" src="{{ asset_prefix }}art/landscape-dark.webp" alt="A hand-drawn crescent Moon above a distant horizon and trees">
    <figcaption>{{ hero_caption|default("One sky at three horizons.") }}</figcaption>
  </figure>
</header>
